<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banana Bliss Oversized T-Shirt</title>
  <link rel="stylesheet" href="Styles\style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand-container">
      <img src="https://img.icons8.com/emoji/48/banana-emoji.png" alt="Banana Logo" class="logo" />
      <h1 class="brand-title">Banana Bliss</h1>
    </div>
    <p class="tagline">Oversized Comfort. Unmatched Style.</p>
  </header>
  
  


  <!-- Custom Banner Title Image -->
<div class="custom-banner">
    <img src="images/banner.png" alt="Embrace Your Personal Style Banner">
  </div>
  
  </div>

  <!-- Main Product Section -->
  <section class="product-section container">
    <div class="product-image">
      <img src="images\peech.jpg" alt="Banana Bliss T-shirt" />
    </div>

    <div class="product-info">
      <h2>Banana Bliss Oversized T-Shirt</h2>
      <button id="sizeChartBtn" class="btn size-btn"> View Size Chart</button>

      <!-- Size Chart Modal -->
      <div id="sizeChartModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <img src="images\size chart.png" alt="Size Chart">
        </div>
      </div>

      <p class="description">
        Experience ultimate comfort and vibrant style with our Banana Bliss Oversized T-shirt, designed for bold personalities and effortless fashion.
      </p>
      <button class="btn add-cart">🛒 Add to Cart</button>
    </div>
  </section>

  <!-- Scrollable Product Section -->
  <section class="scroll-section">
    <h3 class="scroll-title"> Related Products</h3>
    <div class="scroll-container">
      <img src="images\beige (2).jpg" alt="Product 1" />
      <img src="images\beige (1).jpg" alt="Product 2" />
      <img src="images\im-4.webp" alt="Product 3" />
      <img src="images\im-5.webp" alt="Product 4" />
      <img src="images\img-6.jpg" alt="Product 5" />
      <img src="images\brown o-tS (1).jpg" alt="Product 6" />
      <img src="images\beige (3).jpg" alt="Product 7" />
      <img src="images\Letitgogreen_1.webp" alt="Product 8" />
    </div>
  </section>

  <!-- Banner Quote Section -->

  

  <script src="index.js"></script>
</body>
</html>
