<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banana Bliss Oversized T-shirt</title>
  <link rel="stylesheet" href="Styles\style.css">
</head>
<body>
  <div class="product-container">
    <div class="product-image">
      <img src="https://via.placeholder.com/400x400.png?text=Banana+Bliss+T-Shirt" alt="Banana Bliss T-shirt">
    </div>
    <div class="product-details">
      <h1>Banana Bliss Oversized T-shirt</h1>
      <button id="sizeChartBtn">Size Chart</button>

      <!-- Modal -->
      <div id="sizeChartModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <img src="https://via.placeholder.com/600x400.png?text=Size+Chart" alt="Size Chart">
        </div>
      </div>

      <p class="description">Experience ultimate comfort and vibrant style with our Banana Bliss Oversized T-shirt.</p>
      <button class="buy-button">Add to Cart</button>
    </div>
  </div>

  <h2 class="section-title">More Products</h2>
  <div class="horizontal-scroll">
    <img src="https://via.placeholder.com/150" alt="Product 1">
    <img src="https://via.placeholder.com/150" alt="Product 2">
    <img src="https://via.placeholder.com/150" alt="Product 3">
    <img src="https://via.placeholder.com/150" alt="Product 4">
    <img src="https://via.placeholder.com/150" alt="Product 5">
    <img src="https://via.placeholder.com/150" alt="Product 6">
    <img src="https://via.placeholder.com/150" alt="Product 7">
    <img src="https://via.placeholder.com/150" alt="Product 8">
  </div>

  <script src="script.js"></script>
</body>
</html>
