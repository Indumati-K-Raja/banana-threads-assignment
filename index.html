<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- Brand Name and Quote Section -->
    <div class="brand-section">
        <div class="brand-name">
            <span>Banana Bliss</span> <!-- Brand name -->
        </div>
        <p class="brand-quote">"Comfort meets style in every thread."</p> <!-- Brand quote -->
    </div>

    <!-- Product Listing Section -->
    <div class="product-listing">
        <h1 class="product-name">Banana Bliss Oversized T-shirt</h1>
        
        <div class="product-image">
            <img src="images/ban-1.jpg" alt="Product Image">
        </div>

        <div class="product-description">
            <p>Comfortable and stylish oversized t-shirt made from premium cotton.</p>
        </div>

        <div class="product-price">
            <span>$25.99</span>
        </div>

        <div class="product-actions">
            <button class="add-to-cart">Add to Cart</button>
            <button class="buy-now">Buy Now</button>

            <!-- View Size Chart button on the same line -->
            <button id="sizeChartBtn">View Size Chart</button>
        </div>
    </div>

    <div id="sizeChartPopup" class="popup">
        <span class="close">&times;</span>
        <img src="images/size chart.png" alt="Size Chart">
    </div>

    <div class="related-products">
        <h2>Related Products</h2>
        <div class="product-scroll">
            <div class="product-item"><img src="images/brown o-tS (1).jpg" alt="Product 1"></div>
            <div class="product-item"><img src="images/black o-sized.jpg" alt="Product 2"></div>
            <div class="product-item"><img src="images/brown o-tS (7).jpg" alt="Product 3"></div>
            <div class="product-item"><img src="images/green o-tS.jpg" alt="Product 4"></div>
            <div class="product-item"><img src="images/tshrit-2.jpg" alt="Product 5"></div>
            <div class="product-item"><img src="images/hoodie-3.jpg" alt="Product 6"></div>
            <div class="product-item"><img src="images/brown o-tS (6).jpg" alt="Product 7"></div>
            <div class="product-item"><img src="images/shirt-1.jpg" alt="Product 8"></div>
        </div>
    </div>
</body>

<script src="index.js"></script>
</html>
